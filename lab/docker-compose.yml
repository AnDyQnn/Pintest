# ===================================================================
#  lab/docker-compose.yml — ПОЛНАЯ симуляция системы на одном компе.
#
#  Тонкий harness: инстанцирует ТЕ ЖЕ образы/Dockerfile, что и реальный деплой
#  (host/ и agent/), плюс уязвимые цели. Перенос в реальную лабу = те же образы
#  на реальных серверах, код не меняется.
#
#  Две сети (у эмулируемых нод они РАЗНЫЕ):
#    mgmt_net    — хост-сервисы + агенты (provisioning по SSH, вход туннеля)
#    targets_net — ТОЛЬКО агенты + цели. Хост сюда НЕ подключён => не видит цели,
#                  скан/эксплойт идёт с агентов (суть проекта).
#
#  Перед первым запуском: docker build -t pintest-awg-base ../awg-base  (см. build.sh)
# ===================================================================
x-logging: &default-logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  # ------------------------- control plane (хост) --------------------------
  postgres:
    logging: *default-logging
    image: postgres:17-alpine
    environment: { POSTGRES_USER: pintest, POSTGRES_PASSWORD: pintest, POSTGRES_DB: pintest }
    volumes: [ ./data/pg:/var/lib/postgresql/data ]
    networks: [ mgmt_net ]

  vpn:
    logging: *default-logging
    build: { context: .., dockerfile: host/vpn/Dockerfile }
    image: pintest-vpn:latest
    cap_add: [ NET_ADMIN ]
    devices: [ /dev/net/tun ]
    environment:
      HOST_TUNNEL_IP: 10.9.0.1
      AWG_ENDPOINT: 172.31.0.10:51820      # адрес vpn в mgmt_net — сюда дозваниваются агенты
      AWG_LISTEN_PORT: "51820"
    volumes: [ ./data/vpn:/etc/amnezia/amneziawg ]
    networks:
      mgmt_net: { ipv4_address: 172.31.0.10 }

  backend:
    logging: *default-logging
    build: { context: .., dockerfile: host/backend/Dockerfile }
    image: pintest-backend:latest
    network_mode: "service:vpn"            # делит netns vpn -> видит awg0 и агентов в туннеле
    depends_on: [ vpn, postgres ]
    environment:
      DB_DSN: postgresql://pintest:pintest@postgres:5432/pintest
      VPN_API: http://127.0.0.1:8080
      DATA_DIR: /data
      HOST_TUNNEL_IP: 10.9.0.1
      AWG_ENDPOINT: 172.31.0.10:51820
      CHUNK_SIZE: "3"
      ADMIN_USER: admin
      ADMIN_PASSWORD: admin
    volumes: [ ./data:/data ]

  frontend:
    logging: *default-logging
    build: { context: .., dockerfile: host/frontend/Dockerfile }
    image: pintest-frontend:latest
    depends_on: [ vpn ]
    ports: [ "8443:443" ]                  # вебка: https://localhost:8443
    volumes: [ ./data/certs:/etc/nginx/certs ]
    networks: [ mgmt_net ]

  # ------------------------------ агенты -----------------------------------
  agent1:
    logging: *default-logging
    build: { context: .., dockerfile: agent/Dockerfile }
    image: pintest-agent:latest
    hostname: agent1
    cap_add: [ NET_ADMIN ]
    devices: [ /dev/net/tun ]
    restart: "no"
    environment: { AGENT_NAME: agent1, AGENT_SSH_USER: root, AGENT_SSH_PASSWORD: pintest, HOST_TUNNEL_IP: 10.9.0.1 }
    volumes: [ ./data/agent1:/opt/pintest/agent/state ]
    networks: [ mgmt_net, targets_net ]

  agent2:
    logging: *default-logging
    image: pintest-agent:latest      # образ строит agent1 (избегаем гонки одинакового image)
    depends_on: [ agent1 ]
    hostname: agent2
    cap_add: [ NET_ADMIN ]
    devices: [ /dev/net/tun ]
    restart: "no"
    environment: { AGENT_NAME: agent2, AGENT_SSH_USER: root, AGENT_SSH_PASSWORD: pintest, HOST_TUNNEL_IP: 10.9.0.1 }
    volumes: [ ./data/agent2:/opt/pintest/agent/state ]
    networks: [ mgmt_net, targets_net ]

  agent3:
    logging: *default-logging
    image: pintest-agent:latest      # образ строит agent1 (избегаем гонки одинакового image)
    depends_on: [ agent1 ]
    hostname: agent3
    cap_add: [ NET_ADMIN ]
    devices: [ /dev/net/tun ]
    restart: "no"
    environment: { AGENT_NAME: agent3, AGENT_SSH_USER: root, AGENT_SSH_PASSWORD: pintest, HOST_TUNNEL_IP: 10.9.0.1 }
    volumes: [ ./data/agent3:/opt/pintest/agent/state ]
    networks: [ mgmt_net, targets_net ]

  # ------------------------- уязвимые цели ---------------------------------
  target-vsftpd:                            # ДВУДОМНЫЙ: виден агентам (targets_net) + вход в скрытый сегмент
    logging: *default-logging
    build: { context: .., dockerfile: lab/targets/vsftpd234/Dockerfile }
    networks:
      targets_net: { ipv4_address: 172.30.0.11 }
      hidden_net:  { ipv4_address: 10.66.0.2 }
  target-apache:
    logging: *default-logging
    build: { context: .., dockerfile: lab/targets/apache2449/Dockerfile }
    networks: { targets_net: { ipv4_address: 172.30.0.12 } }
  target-shellshock:
    logging: *default-logging
    build: { context: .., dockerfile: lab/targets/shellshock/Dockerfile }
    networks: { targets_net: { ipv4_address: 172.30.0.13 } }
  target-oldssh:
    logging: *default-logging
    build: { context: .., dockerfile: lab/targets/oldssh/Dockerfile }
    networks: { targets_net: { ipv4_address: 172.30.0.14 } }
  target-clean:
    logging: *default-logging
    image: nginx:1.27-alpine                # «пропатченный» хост для контраста
    networks: { targets_net: { ipv4_address: 172.30.0.15 } }

  # --- веб-RCE цели: одна мишень (webrce) под разные CVE через SIM_CVE ---
  target-struts:                            # CVE-2017-5638 (OGNL в Content-Type)
    logging: *default-logging
    build: { context: .., dockerfile: lab/targets/webrce/Dockerfile }
    environment: { SIM_CVE: struts, SIM_BANNER: "Apache-Coyote/1.1" }
    networks: { targets_net: { ipv4_address: 172.30.0.16 } }
  target-drupal:                            # CVE-2018-7600 (Drupalgeddon2)
    logging: *default-logging
    build: { context: .., dockerfile: lab/targets/webrce/Dockerfile }
    environment: { SIM_CVE: drupal, SIM_BANNER: "Apache/2.4.7 (Ubuntu) Drupal/7.57" }
    networks: { targets_net: { ipv4_address: 172.30.0.17 } }
  target-phpcgi:                            # CVE-2012-1823 (php-cgi query-string)
    logging: *default-logging
    build: { context: .., dockerfile: lab/targets/webrce/Dockerfile }
    environment: { SIM_CVE: phpcgi, SIM_BANNER: "Apache/2.4.10 PHP/5.4.3" }
    networks: { targets_net: { ipv4_address: 172.30.0.18 } }
  target-tomcat:                            # CVE-2017-12617 (PUT JSP)
    logging: *default-logging
    build: { context: .., dockerfile: lab/targets/webrce/Dockerfile }
    environment: { SIM_CVE: tomcat, SIM_BANNER: "Apache-Coyote/1.1" }
    networks: { targets_net: { ipv4_address: 172.30.0.19 } }

  # --- СКРЫТЫЙ сегмент: агенты сюда НЕ ходят, только через pivot (vsftpd) ---
  target-hidden-web:
    logging: *default-logging
    build: { context: .., dockerfile: lab/targets/apache2449/Dockerfile }
    networks: { hidden_net: { ipv4_address: 10.66.0.11 } }
  target-hidden-ssh:
    logging: *default-logging
    build: { context: .., dockerfile: lab/targets/oldssh/Dockerfile }
    networks: { hidden_net: { ipv4_address: 10.66.0.12 } }
  target-hidden-struts:                     # CVE-2017-5638 в скрытом сегменте — берётся через pivot
    logging: *default-logging
    build: { context: .., dockerfile: lab/targets/webrce/Dockerfile }
    environment: { SIM_CVE: struts, SIM_BANNER: "Apache-Coyote/1.1" }
    networks: { hidden_net: { ipv4_address: 10.66.0.13 } }

networks:
  mgmt_net:
    driver: bridge
    ipam: { config: [ { subnet: 172.31.0.0/16 } ] }
  targets_net:
    driver: bridge
    ipam: { config: [ { subnet: 172.30.0.0/16 } ] }
  hidden_net:                               # скрытый сегмент за pivot'ом (агенты не подключены)
    driver: bridge
    internal: true
    ipam: { config: [ { subnet: 10.66.0.0/16 } ] }
