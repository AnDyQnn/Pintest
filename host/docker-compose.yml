# host/docker-compose.yml — стек основного сервера (control plane).
# Стандартные контейнеры: backend + frontend + postgres + vpn + fail2ban.
# Данные — на диске через bind-volume ./data (не внутри контейнеров).
# В докер-лабе тот же стек поднимает lab/docker-compose.yml (те же образы/контекст).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pintest
      POSTGRES_PASSWORD: pintest
      POSTGRES_DB: pintest
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    networks: [pintest]
    restart: unless-stopped

  vpn:
    build: { context: .., dockerfile: host/vpn/Dockerfile }
    image: pintest-vpn:latest
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun]
    environment:
      HOST_TUNNEL_IP: ${HOST_TUNNEL_IP:-10.9.0.1}
      AWG_ENDPOINT: ${AWG_ENDPOINT:-}          # <публичный_ip_хоста>:51820 для клиент-конфигов
      AWG_LISTEN_PORT: "51820"
    volumes:
      - ./data/vpn:/etc/amnezia/amneziawg      # ключи/params сервера переживают пересоздание
    ports:
      - "51820:51820/udp"                       # вход туннеля для агентов
    networks: [pintest]
    restart: unless-stopped

  backend:
    build: { context: .., dockerfile: host/backend/Dockerfile }
    image: pintest-backend:latest
    # делит сетевой стек vpn -> видит awg0 и достаёт агентов по туннелю 10.9.0.X
    network_mode: "service:vpn"
    depends_on: [vpn, postgres]
    environment:
      DB_DSN: postgresql://pintest:pintest@postgres:5432/pintest
      VPN_API: http://127.0.0.1:8080
      DATA_DIR: /data
      HOST_TUNNEL_IP: ${HOST_TUNNEL_IP:-10.9.0.1}
      AWG_ENDPOINT: ${AWG_ENDPOINT:-}
      CHUNK_SIZE: ${CHUNK_SIZE:-4}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      SESSION_SECRET: ${SESSION_SECRET:-change-me}
    volumes:
      - ./data:/data
    restart: unless-stopped

  frontend:
    build: { context: .., dockerfile: host/frontend/Dockerfile }
    image: pintest-frontend:latest
    depends_on: [vpn]
    ports:
      - "8443:443"                              # вебка (HTTPS, самоподпис)
    volumes:
      - ./data/certs:/etc/nginx/certs
    networks: [pintest]
    restart: unless-stopped

  fail2ban:
    build: { context: .., dockerfile: host/fail2ban/Dockerfile }
    image: pintest-fail2ban:latest
    cap_add: [NET_ADMIN, NET_RAW]
    networks: [pintest]
    restart: unless-stopped

networks:
  pintest:
    driver: bridge
