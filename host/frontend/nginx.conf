# frontend/nginx.conf — HTTPS-only reverse proxy + статика дашборда.
# /api/* и /api/live (WebSocket) проксируются на backend (делит netns с vpn -> vpn:8000).

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;      # только HTTPS
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # WebSocket живого статуса
    location /api/live {
        proxy_pass http://vpn:8000/api/live;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # REST API
    location /api/ {
        proxy_pass http://vpn:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
